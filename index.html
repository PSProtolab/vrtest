<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Centralina</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#000; font-family: -apple-system, sans-serif; }

    #enter-screen {
      position:fixed; inset:0; background:#000;
      display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:20px;
      z-index:999;
    }
    #enter-screen.hidden { display:none; }
    #enter-screen p { color:rgba(255,255,255,0.5); font-size:14px; text-align:center; max-width:300px; line-height:1.6; }
    #btn-ar {
      padding:18px 48px; background:rgba(0,255,136,0.12);
      border:2px solid #00ff88; border-radius:12px;
      color:#00ff88; font-size:18px; font-weight:700;
      letter-spacing:.08em; cursor:pointer;
    }
    #xr-status { color:rgba(255,255,255,0.35); font-size:12px; font-family:monospace; text-align:center; max-width:320px; }

    /* DOM overlay — questo è ciò che viene mostrato sopra il passthrough */
    #overlay {
      position:fixed; inset:0;
      pointer-events:none;
      z-index:10;
      display:none;
    }
    #overlay.active { display:block; }

    /* Pannello dati in basso */
    #panel {
      position:absolute; bottom:32px; left:24px; right:24px;
      background:rgba(6,18,10,0.92);
      border:1.5px solid rgba(0,255,136,0.5);
      border-radius:16px; padding:20px 22px;
      pointer-events:all;
    }

    .panel-title { font-size:11px; color:#00ff88; letter-spacing:.1em; font-weight:700; text-transform:uppercase; margin-bottom:14px; }

    .metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
    .metric { background:rgba(255,255,255,0.06); border-radius:8px; padding:10px 12px; }
    .mlabel { font-size:10px; color:rgba(255,255,255,0.4); margin-bottom:4px; }
    .mval { font-size:24px; font-weight:700; }
    .munit { font-size:11px; font-weight:400; }
    .ok     { color:#4ade80; }
    .warn   { color:#fbbf24; }
    .danger { color:#f87171; }
    .white  { color:#fff; }

    .bar-wrap { height:5px; background:rgba(255,255,255,0.1); border-radius:3px; margin-bottom:14px; }
    .bar-fill { height:100%; border-radius:3px; transition:width .5s, background .5s; }

    .status-row { display:flex; align-items:center; gap:8px; padding-top:12px; border-top:.5px solid rgba(0,255,136,0.15); }
    .badge { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 12px; border-radius:7px; }
    .badge.ok     { background:rgba(74,222,128,0.15); color:#4ade80; }
    .badge.warn   { background:rgba(251,191,36,0.15); color:#fbbf24; }
    .badge.danger { background:rgba(248,113,113,0.15); color:#f87171; }
    .bdot { width:7px; height:7px; border-radius:50%; }

    .alert-row { margin-top:10px; padding:8px 12px; background:rgba(251,191,36,0.08); border-left:2px solid #fbbf24; border-radius:0 6px 6px 0; font-size:11px; color:#fbbf24; }

    /* HUD top */
    #hud { position:absolute; top:20px; left:20px; right:20px; display:flex; gap:10px; align-items:center; pointer-events:none; }
    .chip { font-size:11px; font-weight:700; letter-spacing:.08em; color:#00ff88; background:rgba(0,255,136,0.1); border:1px solid rgba(0,255,136,0.4); border-radius:5px; padding:5px 12px; }
    .rec { margin-left:auto; display:flex; align-items:center; gap:5px; font-size:11px; color:#ff5050; }
    .recdot { width:7px; height:7px; border-radius:50%; background:#ff5050; animation:blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.1} }

    /* Zone switcher */
    #zones { position:absolute; top:68px; right:20px; display:flex; flex-direction:column; gap:8px; pointer-events:all; }
    .zbtn { font-size:11px; font-weight:700; color:rgba(0,255,136,0.8); background:rgba(6,18,10,0.85); border:1px solid rgba(0,255,136,0.25); border-radius:7px; padding:8px 16px; cursor:pointer; }
    .zbtn.active { border-color:#00ff88; background:rgba(0,255,136,0.15); color:#00ff88; }

    /* Debug box */
    #debug { position:absolute; top:68px; left:20px; background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.2); border-radius:6px; padding:8px 12px; font-size:10px; color:rgba(255,255,255,0.5); font-family:monospace; max-width:200px; line-height:1.6; }
  </style>
</head>
<body>

<!-- Schermata iniziale -->
<div id="enter-screen">
  <p>Protolab · DKNatureLink AR<br><br>Tocca il pulsante per attivare il passthrough AR</p>
  <button id="btn-ar">ENTRA IN AR</button>
  <div id="xr-status">verifica supporto WebXR...</div>
</div>

<!-- Overlay DOM sopra il passthrough -->
<div id="overlay">
  <div id="hud">
    <div class="chip">AR LIVE</div>
    <div class="chip" id="chip-zone">ZONA NORD</div>
    <div class="rec"><div class="recdot"></div>REC</div>
  </div>

  <div id="debug">
    session: <span id="dbg-session">-</span><br>
    overlay: <span id="dbg-overlay">-</span><br>
    frame: <span id="dbg-frame">0</span>
  </div>

  <div id="zones">
    <div class="zbtn active" onclick="selectZone(0)">NORD</div>
    <div class="zbtn" onclick="selectZone(1)">EST</div>
    <div class="zbtn" onclick="selectZone(2)">SUD</div>
  </div>

  <div id="panel">
    <div class="panel-title" id="p-id">ZONA NORD — CEN-001</div>
    <div class="metrics">
      <div class="metric">
        <div class="mlabel">Soil moisture</div>
        <div class="mval ok" id="m-moist">72<span class="munit">%</span></div>
      </div>
      <div class="metric">
        <div class="mlabel">Temp. suolo</div>
        <div class="mval white" id="m-temp">19.4<span class="munit">°C</span></div>
      </div>
      <div class="metric">
        <div class="mlabel">Irrigazione</div>
        <div class="mval ok" id="m-irr">OFF</div>
      </div>
    </div>
    <div class="bar-wrap"><div class="bar-fill" id="bar" style="width:72%;background:#4ade80"></div></div>
    <div class="status-row">
      <div class="badge ok" id="badge">
        <div class="bdot" id="bdot" style="background:#4ade80"></div>
        <span id="badge-txt">Sistema normale</span>
      </div>
    </div>
    <div class="alert-row" id="alert-row" style="display:none"></div>
  </div>
</div>

<!-- Canvas WebXR (trasparente) -->
<canvas id="c" style="position:fixed;inset:0;width:100%;height:100%;display:none;"></canvas>

<script>
// ── Dati centraline ──
const zones = [
  { id:'CEN-001', name:'Zona Nord', chip:'ZONA NORD', moisture:72, temp:19.4, irrigation:false, anomaly:false, alertText:'', lastUpdate:'2 min fa', status:'ok' },
  { id:'CEN-002', name:'Zona Est',  chip:'ZONA EST',  moisture:31, temp:22.1, irrigation:true,  anomaly:true,  alertText:'Pressione valvola anomala — verifica raccordo V3', lastUpdate:'8 min fa', status:'danger' },
  { id:'CEN-003', name:'Zona Sud',  chip:'ZONA SUD',  moisture:54, temp:21.0, irrigation:false, anomaly:true,  alertText:'Soil moisture in calo — schedulare irrigazione', lastUpdate:'5 min fa', status:'warn' }
];

function mCol(v){ return v<35?'#f87171':v<50?'#fbbf24':'#4ade80'; }
function mCls(v){ return v<35?'danger':v<50?'warn':'ok'; }

function updatePanel(z){
  document.getElementById('chip-zone').textContent = z.chip;
  document.getElementById('p-id').textContent = `${z.name.toUpperCase()} — ${z.id}`;
  const mm = document.getElementById('m-moist');
  mm.className = `mval ${mCls(z.moisture)}`;
  mm.innerHTML = `${z.moisture}<span class="munit">%</span>`;
  document.getElementById('m-temp').innerHTML = `${z.temp}<span class="munit">°C</span>`;
  const mi = document.getElementById('m-irr');
  mi.className = `mval ${z.irrigation?'warn':'ok'}`;
  mi.textContent = z.irrigation?'ON':'OFF';
  document.getElementById('bar').style.width = z.moisture+'%';
  document.getElementById('bar').style.background = mCol(z.moisture);
  const badge = document.getElementById('badge');
  badge.className = `badge ${z.status}`;
  document.getElementById('bdot').style.background = mCol(z.moisture);
  document.getElementById('badge-txt').textContent = z.status==='ok'?'Sistema normale':z.status==='warn'?'Attenzione richiesta':'Anomalia rilevata';
  const ar = document.getElementById('alert-row');
  ar.style.display = z.anomaly?'block':'none';
  ar.textContent = z.alertText;
}

function selectZone(i){
  document.querySelectorAll('.zbtn').forEach((b,idx)=>b.classList.toggle('active',idx===i));
  updatePanel(zones[i]);
}

// ── WebXR ──
let xrSession = null;
let frameCount = 0;

async function enterAR(){
  const st = document.getElementById('xr-status');

  // Se WebXR non disponibile: flat fallback
  if (!navigator.xr) {
    showOverlay('flat-no-xr');
    return;
  }

  let arSupported = false;
  try { arSupported = await navigator.xr.isSessionSupported('immersive-ar'); } catch(e){}

  if (!arSupported) {
    showOverlay('flat-no-ar');
    return;
  }

  // Prova con dom-overlay
  try {
    const sessionInit = {
      requiredFeatures: ['local'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: document.getElementById('overlay') }
    };
    xrSession = await navigator.xr.requestSession('immersive-ar', sessionInit);
    document.getElementById('dbg-session').textContent = 'OK';
  } catch(e) {
    // Prova senza dom-overlay
    try {
      xrSession = await navigator.xr.requestSession('immersive-ar', { requiredFeatures:['local'] });
      document.getElementById('dbg-session').textContent = 'OK (no dom-overlay)';
    } catch(e2) {
      st.textContent = 'Errore sessione: ' + e2.message;
      return;
    }
  }

  // Setup canvas GL per mantenere la sessione attiva
  const canvas = document.getElementById('c');
  canvas.style.display = 'block';
  const gl = canvas.getContext('webgl', { xrCompatible: true });
  await gl.makeXRCompatible();
  xrSession.updateRenderState({ baseLayer: new XRWebGLLayer(xrSession, gl) });

  // Mostra overlay
  showOverlay('xr');

  // Loop XR minimale (necessario per mantenere la sessione attiva)
  const refSpace = await xrSession.requestReferenceSpace('local');
  xrSession.requestAnimationFrame(function loop(t, frame){
    frameCount++;
    if(frameCount % 60 === 0) document.getElementById('dbg-frame').textContent = frameCount;
    xrSession.requestAnimationFrame(loop);
  });

  xrSession.addEventListener('end', () => {
    document.getElementById('dbg-session').textContent = 'ended';
  });
}

function showOverlay(mode){
  document.getElementById('enter-screen').classList.add('hidden');
  document.getElementById('overlay').classList.add('active');
  document.getElementById('dbg-overlay').textContent = mode;
  updatePanel(zones[0]);
}

document.getElementById('btn-ar').addEventListener('click', enterAR);

// Check on load
window.addEventListener('load', async () => {
  const st = document.getElementById('xr-status');
  updatePanel(zones[0]);
  if (!navigator.xr) { st.textContent = 'WebXR non disponibile — useremo modalità flat'; document.getElementById('btn-ar').textContent = 'APRI DEMO'; return; }
  try {
    const ok = await navigator.xr.isSessionSupported('immersive-ar');
    st.textContent = ok ? '✓ AR supportata — Quest 3 rilevato' : 'AR non supportata — modalità flat';
    if(!ok) document.getElementById('btn-ar').textContent = 'APRI DEMO';
  } catch(e){ st.textContent = 'errore: '+e.message; }
});
</script>
</body>
</html>
